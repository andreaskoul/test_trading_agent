name: Fund · weekly desks

# PROTOCOL_fund.md. Wednesday after the US close, one run through the desks:
# screen -> ideation -> research (narrative-dashboard pipeline on the coverage
# list) -> analysts -> red team -> PM/risk -> macro FX -> [commit decisions]
# -> IC memo -> performance -> [commit]. Decisions are committed to the
# `fund-data` branch before the Thursday close at which positions are set;
# the PM desk refuses after Thursday 19:00 UTC.
#
# Secrets: OPENROUTER_API_KEY, FINNHUB_API_KEY (required), POLYGON_API_KEY (optional).

on:
  # Started by the external scheduler (cron-job.org, schedule in fund/README.md); no GitHub cron,
  # whose scheduled runs started hours late or not at all in the first live week.
  workflow_dispatch:
    inputs:
      asof:
        description: "as-of Wednesday (YYYY-MM-DD); empty = latest"
        default: ""
      dry_run:
        description: "Dry run: real calls, no deadline, results only as a run artifact (never committed, never counted)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fund-weekly
  cancel-in-progress: false

jobs:
  # A week is decided once: a second live run for a week that already has a book (a scheduler
  # retry, or a manual start) stops here.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip: ${{ steps.g.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: g
        env:
          FUND_ASOF: ${{ inputs.asof }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          pip -q install pandas
          git fetch -q origin +refs/heads/fund-data:refs/remotes/origin/fund-data 2>/dev/null || { echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0; }
          a=$(cd fund && python -c "from common import asof_from_env; print(asof_from_env().date())")
          if git show "origin/fund-data:fund_state/live/$a/book.json" 2>/dev/null | grep -Eq '"status": "(ok|degraded_hold)"'; then
            echo "week $a already decided: nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  desks:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      FUND_ASOF: ${{ inputs.asof }}
      FUND_DRYRUN: ${{ inputs.dry_run && '1' || '0' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}           # embedding store + S&P 500 news archive
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: pip install "numpy<2" pandas pyarrow yfinance scipy scikit-learn umap-learn huggingface_hub openpyxl

      - name: Restore fund state (weeks, attention history, research feeds and story state)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin fund-data >/dev/null 2>&1; then
            git fetch -q origin +refs/heads/fund-data:refs/remotes/origin/fund-data
            # one path at a time: a pathspec missing on the branch (e.g. no fund_state yet)
            # makes a combined checkout restore nothing
            for p in fund_state fund_research; do
              git checkout origin/fund-data -- "$p" 2>/dev/null || echo "fund-data has no $p yet"
            done
            echo "restored: $(ls fund_research/data/raw 2>/dev/null | wc -l) feeds, $(ls fund_research/data/state 2>/dev/null | wc -l) story states"
          fi

      - name: Restore embedding cache
        uses: actions/cache@v4
        with:
          path: fund_research/data/cache
          key: fund-emb-${{ github.run_id }}
          restore-keys: fund-emb-
      # Fast path only. The permanent copy lives in a private Hugging Face dataset
      # (fund/emb_store.py), so an evicted Actions cache costs nothing.

      - name: Refuse a live run past its deadline (use dry_run for tests)
        if: ${{ !inputs.dry_run }}
        run: |
          cd fund && python -c "
          from common import asof_from_env, deadline_ok
          a = asof_from_env()
          raise SystemExit(0 if deadline_ok(a) else f'live run for {a.date()} is past its Thursday 19:00 UTC deadline: nothing to decide. Tick dry_run to test.')"

      - name: Desk 1 · screen
        run: python fund/screen.py
      - name: Desk 2 · ideation
        run: python fund/ideate.py
      - name: Pull embedding cache from Hugging Face (if the Actions cache missed)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python fund/emb_store.py pull
      - name: Desk 3 · research
        run: python fund/research.py
      - name: Push embedding cache to Hugging Face
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python fund/emb_store.py push
      - name: Save news archive and story state (every run, dry runs included)
        if: always()
        run: bash fund/commit_state.sh "research data" research

      - name: Desk 4 · analysts
        run: python fund/analysts.py
      - name: Desk 5 · red team
        run: python fund/redteam.py
      - name: Desk 6 · PM + risk
        run: python fund/pm_risk.py
      - name: Desk 8 · macro FX
        run: python fund/fx_desk.py

      - name: Commit decisions (before the Thursday close)
        if: ${{ !inputs.dry_run }}
        run: bash fund/commit_state.sh "fund decisions"

      - name: Shadow analysts (C2, C3) and model canary, never traded
        if: ${{ !cancelled() && hashFiles('fund_state/*/*/book.json') != '' }}
        continue-on-error: true
        run: |
          python fund/shadow.py
          FUND_SHADOW=1 python fund/pm_risk.py

      - name: Desk 7 · IC memo
        if: always()
        run: python fund/ic_memo.py
      - name: Desk 9 · performance
        if: always()
        run: python fund/score.py

      - name: Position ledger (Excel)
        if: always()
        continue-on-error: true
        run: python fund/ledger.py

      - name: Commit memo and performance
        if: ${{ always() && !inputs.dry_run }}
        run: bash fund/commit_state.sh "fund memo + performance"

      - name: Gate verdict (issue when it is not CONTINUE)
        if: ${{ always() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=fund_state/live/performance/gate.json
          [ -f "$f" ] || exit 0
          v=$(python -c "import json;print(json.load(open('$f'))['verdict'])")
          echo "gate: $v"; cat fund_state/live/performance/gate.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$v" != "CONTINUE" ]; then
            gh issue create --title "Fund gate: $v ($(date -u +%F))" --body "$(cat fund_state/live/performance/gate.md) @${{ github.repository_owner }}"
          fi

      - name: Dry-run artifact
        if: ${{ always() && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: fund-dryrun-${{ github.run_id }}
          path: fund_state/dryrun
          retention-days: 30

      - name: Alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Fund: ${{ github.workflow }} failed $(date -u +%F)" \
            --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} @${{ github.repository_owner }}"
