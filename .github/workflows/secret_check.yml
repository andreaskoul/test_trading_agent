name: Check FRED and SEC secrets (temporary)
on:
  push:
    branches: [amendment-6-info-flows]
    paths: ['.github/workflows/secret_check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: FRED_API_KEY is set
        env: {K: "${{ secrets.FRED_API_KEY }}"}
        run: test -n "$K"
      - name: FRED_API_KEY is a 32-character lowercase key
        env: {K: "${{ secrets.FRED_API_KEY }}"}
        run: echo "$K" | grep -Eq '^[a-z0-9]{32}$'
      - name: FRED accepts the key (release calendar)
        env: {K: "${{ secrets.FRED_API_KEY }}"}
        run: |
          code=$(curl -s -o r.json -w '%{http_code}' "https://api.stlouisfed.org/fred/releases/dates?api_key=$K&file_type=json&limit=5&include_release_dates_with_no_data=true&sort_order=desc")
          echo "HTTP $code"; test "$code" = 200 && python3 -c "import json;d=json.load(open('r.json'));print(len(d['release_dates']),'release dates')"
      - name: SEC_USER_AGENT is set
        env: {U: "${{ secrets.SEC_USER_AGENT }}"}
        run: test -n "$U"
      - name: SEC_USER_AGENT shape (no value printed)
        if: always()
        env: {U: "${{ secrets.SEC_USER_AGENT }}"}
        run: |
          python3 -c "import os;u=os.environ['U'];print('length',len(u),'| has @',('@' in u),'| has space',(' ' in u.strip()),'| leading/trailing whitespace or quotes',u!=u.strip().strip('\"').strip(\"'\"),'| newline',chr(10) in u)"
      - name: EDGAR accepts the User-Agent (submissions + daily index)
        if: always()
        env: {U: "${{ secrets.SEC_USER_AGENT }}"}
        run: |
          c1=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: $U" https://data.sec.gov/submissions/CIK0000320193.json)
          c2=$(curl -s -o /dev/null -w '%{http_code}' -H "User-Agent: $U" https://www.sec.gov/Archives/edgar/daily-index/2026/QTR3/)
          echo "submissions HTTP $c1, daily index HTTP $c2"; test "$c1" = 200 && test "$c2" = 200
