name: Fund · dashboard (GitHub Pages)

# Publishes fund/site/ (the assessment page, the paper account and the ledger) with the ledger's dashboard.json,
# the shadow and research data, the gate report and the Excel file from the `fund-data` and `research-data`
# branches. Runs after every workflow that can change the trade record, and on demand.

on:
  workflow_run:
    workflows: ["Fund · weekly desks", "Fund · execution (Alpaca paper)", "Fund · lifecycle trade (Protocol 7)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R fund/site/. _site/          # pages (assessment, account/, ledger/, shadow/ redirect) + site.css/site.js
          git fetch -q origin +refs/heads/fund-data:refs/remotes/origin/fund-data || true
          for f in dashboard.json shadow.json fund_positions.xlsx; do
            git show "origin/fund-data:fund_state/live/ledger/$f" > "_site/$f" 2>/dev/null || rm -f "_site/$f"
          done
          # the scorer's weekly gate report, shown word for word on the assessment page
          git show "origin/fund-data:fund_state/live/performance/gate.md" > _site/gate.md 2>/dev/null || rm -f _site/gate.md
          git fetch -q origin +refs/heads/research-data:refs/remotes/origin/research-data || true
          git show "origin/research-data:fund_state/live/research/qshadow/ledger.json" > _site/research.json 2>/dev/null \
            || echo '{"books":{}}' > _site/research.json
          git show "origin/research-data:fund_state/live/research/spx/page.json" > _site/spx.json 2>/dev/null \
            || echo '{"books":[],"weeks":[],"records":0}' > _site/spx.json
          git show "origin/research-data:fund_state/live/research/regime/page.json" > _site/regime.json 2>/dev/null \
            || echo '{"records":0,"books":{},"states":[]}' > _site/regime.json
          git show "origin/research-data:fund_state/live/research/beta/page.json" > _site/beta.json 2>/dev/null \
            || echo '{"records":0,"scored":0,"rows":[],"evidence":{"oos_mse_B0":0.1454,"oos_mse_B1":0.0971,"oos_t":7.56}}' > _site/beta.json
          git show "origin/research-data:fund_state/live/research/f2/page.json" > _site/f2.json 2>/dev/null \
            || echo '{"records":0,"weeks":0,"weekly":[],"evidence":{"oos_2020_2025":{"bp_per_sd":-3.4,"t":-1.88,"net_pct_yr_2bp":2.08,"sharpe":0.49},"sp400_2016_2025":{"bp_per_sd":-2.7,"t":-1.61,"p":0.054}}}' > _site/f2.json
          [ -f _site/dashboard.json ] || echo '{"updated":"no trades yet","positions":[],"orders":[],"account":[],"cash":[]}' > _site/dashboard.json
          [ -f _site/shadow.json ] || echo '{"updated":"not built yet","marks":"","start":100000,"books":[],"lifecycle":null,"account":null}' > _site/shadow.json
          # performance report (QuantStats) from the broker's equity curve; never blocks the deploy
          git show "origin/fund-data:fund_state/live/execution/nav.csv" > /tmp/nav.csv 2>/dev/null || true
          if [ -s /tmp/nav.csv ]; then
            pip -q install quantstats yfinance && python fund/perf_report.py /tmp/nav.csv _site/report.html \
              || echo "::warning::performance report not built"
          fi
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
