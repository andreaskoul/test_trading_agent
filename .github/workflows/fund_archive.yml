name: Fund · news archive (daily)

# Data desk (fund/archive.py): Finnhub company news for every S&P 500 member, one
# UTC day per file, in the private Hugging Face dataset <you>/fund-news-archive.
# Research reads it, so names new to coverage need no 91-day fetch on Wednesday.
# Daily at 21:20 UTC via the local runner (after the US close, before the Wednesday desks).
# While the 91-day window is incomplete, a run re-dispatches itself to continue.

on:
  # Scheduled runs happen on the local runner (fund/local/, schedule in fund/README.md); this workflow is the manual fallback. No GitHub cron,
  # whose scheduled runs started hours late or not at all in the first live week.
  workflow_dispatch:
    inputs:
      minutes:
        description: "Finnhub budget for this run (minutes); backfill runs use ~330"
        default: "330"

permissions:
  contents: read
  actions: write
  issues: write          # to chain the next backfill run

concurrency:
  group: fund-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ARCHIVE_MINUTES: ${{ inputs.minutes || '40' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow huggingface_hub
      - id: arch
        run: python fund/archive.py
      # Amendment 6 (shadow input only): macro calendar, Kalshi, AI-GPR, GDELT, market news, 8-K filings,
      # point in time in <you>/fund-context-archive. Never fails the news archive; one run a day is enough,
      # so the chained backfill runs (minutes=330) skip it.
      - name: Context archive (Amendment 6)
        if: ${{ always() && (inputs.minutes || '40') != '330' }}
        continue-on-error: true
        timeout-minutes: 25
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python fund/context_archive.py
      - name: Continue the backfill in a new run
        if: steps.arch.outputs.backlog != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # not on a Wednesday afternoon/evening: the weekly desks need Finnhub from 22:15 UTC
          if [ "$(date -u +%u)" = "3" ] && [ "$(date -u +%H)" -ge 12 ]; then
            echo "backlog ${{ steps.arch.outputs.backlog }} days: left for the daily runs"; exit 0
          fi
          gh workflow run fund_archive.yml --ref "${{ github.ref_name }}" -f minutes=330
          echo "backlog ${{ steps.arch.outputs.backlog }} days: next backfill run dispatched"

      - name: Alert
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Fund: ${{ github.workflow }} failed $(date -u +%F)" \
            --body "Run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} @${{ github.repository_owner }}"
